image boot.vfat {
	vfat {
		files = {
			"Image",
			"socfpga_agilex5_socdk.dtb",
			"u-boot.itb",
			"kernel.itb",
			"boot.scr.uimg"
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xc
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
